<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="{{ site.description }}">
        <link rel="stylesheet" href="styles/style.css">

        <title>{{ site.name }}</title>
    </head>

    <body>
        {% include header.html %}

        <div class="progress-bar" aria-hidden="true"><div class="progress-bar__fill"></div></div>

        <div class="search-wrap">
          <div class="search-inner">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="searchInput" placeholder="搜索清单项…" data-i18n-ph data-ph-zh="搜索清单项…" data-ph-en="Search checklist…" aria-label="Search">
              <kbd>/</kbd>
            </div>
            <button type="button" class="reset-btn" id="resetProgress" data-i18n data-zh="重置勾选" data-en="Reset">重置勾选</button>
            <div class="global-progress" aria-live="polite">
              <span class="track"><span class="fill" id="globalFill"></span></span>
              <span id="globalCount">0 / 0</span>
            </div>
          </div>
        </div>

        {{ content }}

        {% include footer.html %}

        {% include external_js.html %}
    </body>
</html>
